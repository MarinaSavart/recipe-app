services:

  # ── Base de données ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: recipes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/recipes
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend:/app              # hot reload du code
      - uploads_data:/app/uploads   # persistance des photos
    depends_on:
      db:
        condition: service_healthy  # attend que PostgreSQL soit prêt
    extra_hosts:
      - "host.docker.internal:host-gateway"  # accès à Ollama sur la machine hôte

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app             # hot reload du code
      - /app/node_modules           # évite d'écraser les node_modules du container
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data: